[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sage"
version = "0.1.0"
description = "Analyze application logs using a locally running LLM through Ollama"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
sage = "cli:main"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
]
